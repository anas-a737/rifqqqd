<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رِفْق</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#06100c">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#06100c;--surface:#0d1f17;--surface2:#12291e;--line:#1f3d2e;--em:#1f8f68;--em-d:#0f5a41;--gold:#c9a45c;--text:#f3ecd9;--muted:#9fb3a6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Tajawal",system-ui,sans-serif;line-height:1.7;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding:20px 18px}
h1,h2,h3{font-family:"Reem Kufi","Tajawal",serif;font-weight:700}
.brand{display:flex;align-items:baseline;justify-content:space-between}
.brand h1{font-size:2rem;color:var(--gold);letter-spacing:.02em}
.brand span{color:var(--muted);font-size:.85rem}
.slogan{color:var(--muted);font-size:.95rem;margin:2px 0 20px}
.hero{background:linear-gradient(160deg,var(--em-d),var(--surface) 70%);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;align-items:center;gap:18px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(90deg) scaleX(-1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:"Reem Kufi";font-size:1.5rem;color:var(--gold)}
.hero h2{font-size:1.25rem}
.hero p{color:var(--muted);font-size:.92rem}
.sec{display:flex;justify-content:space-between;align-items:center;margin:26px 0 10px}
.sec h3{font-size:1.15rem}
.sec small{color:var(--muted)}
.task{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;color:var(--text);font:inherit;text-align:start;cursor:pointer}
.task:focus-visible,.nav button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--em);flex:none;display:grid;place-items:center;transition:background .2s}
.task.done .chk{background:var(--em)}
.task.done .chk::after{content:"✓";font-size:.8rem;color:var(--bg)}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.t{flex:1}
.time{color:var(--gold);font-size:.85rem;white-space:nowrap}
.tag{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 8px}
.tag.fx{color:var(--gold);border-color:var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--muted)}
.card strong{color:var(--text)}
.empty{text-align:center;padding:48px 16px}
.empty h2{color:var(--gold);margin-bottom:8px}
.empty p{color:var(--muted)}
.nav{position:fixed;inset:auto 0 0 0;background:rgba(6,16,12,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{background:none;border:0;color:var(--muted);font:inherit;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;cursor:pointer;border-radius:10px;min-width:52px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--gold)}
.view{display:none}.view.on{display:block}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select,textarea{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 10px;font:inherit;max-width:100%}
textarea{width:100%;min-height:60px;margin-bottom:8px}
.btn{background:var(--em-d);border:1px solid var(--em);color:var(--text);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.btn.g{background:none;border-color:var(--gold);color:var(--gold)}.btn.s{padding:3px 10px;font-size:.8rem}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}.links .btn{text-align:center}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--gold)}
.big{font-family:"Reem Kufi";font-size:2rem;color:var(--gold);text-align:center}
.p1{border-inline-start:3px solid var(--gold)}.hint{color:var(--muted);font-size:.82rem}
.cols{display:flex;gap:6px;align-items:flex-end;height:90px}.cols div{flex:1;text-align:center;font-size:.7rem;color:var(--muted)}.cols i{display:block;background:var(--em);border-radius:5px 5px 0 0;margin-bottom:3px}
#sl{display:none;position:fixed;inset:0;z-index:99;background:#000;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}#sl.on{display:flex}#sl .clk{font-family:"Reem Kufi";font-size:4rem;color:#6b5a30}#sl .btn{font-size:1.1rem;padding:14px 28px}
</style>
</head>
<body>
<main>
<div class="brand"><h1>رِفْق</h1><span id="date"></span></div>
<p class="slogan">نحو حياة أكثر انضباطاً، وقلب أكثر قرباً من الله</p>

<section class="view on" id="v-home"></section>
<section class="view" id="v-day"></section>
<section class="view" id="v-faith"></section>
<section class="view" id="v-dev"></section>
<section class="view" id="v-health"></section>
<section class="view" id="v-stats"></section>
</main>
<div id="sl"><div class="clk" id="slc"></div><p class="hint">وضع النوم. الشاشة هادئة، ولا شيء يشغلك.</p><div id="slb" class="row" style="justify-content:center"></div><button class="btn s" id="slx" style="margin-top:30px;opacity:.6">اضغط مطولاً ٣ ثوانٍ للخروج</button></div>
<nav class="nav" id="nav"></nav>
<script>
const AR=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const day=(o=0)=>{const d=new Date();d.setDate(d.getDate()-o);return d.toISOString().slice(0,10)};
const TD=day();
const DEF={tasks:[
{id:"a1",t:"الاستيقاظ والفجر",s:"05:00",e:"05:30",k:"ثابتة",p:1},
{id:"a2",t:"أذكار الصباح",s:"05:30",e:"05:38",k:"ثابتة",p:1},
{id:"a3",t:"تطوير الذات",s:"10:00",e:"10:45",k:"مرنة",p:2},
{id:"a4",t:"التمرين",s:"16:00",e:"17:00",k:"ثابتة",p:1},
{id:"a5",t:"النوم",s:"21:30",e:"22:00",k:"ثابتة",p:1}],
done:{},pr:{},qr:{},ad:{},wt:{},dv:{},rv:{},wk:{},

let S;try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem("rifq2")||"{}"))}catch(e){S=DEF}

function delLink(i){S.links.splice(i,1);save();render()}
function addLink(){const n=document.getElementById("ln").value.trim(),u=document.getElementById("lu").value.trim();if(!n||!u)return;S.links.push({n,u});save();render()}

function addT(){const t=document.getElementById("nt").value.trim();if(!t)return;S.tasks.push({id:"t"+Date.now(),t,s:nts.value,e:nte.value,k:ntk.value,p:+ntp.value});save();render()}
function setPr(k){const d=dd("pr");d[k]=!d[k];save();render()}
function qr(v){const d=dd("qr");d.v=Math.max(0,(d.v||0)+v);save();render()}
function water(v){const d=dd("wt");d.v=Math.max(0,(d.v||0)+v);save();render()}
function devAdd(k,v){const d=dd("dv");d[k]=Math.max(0,(d[k]||0)+v);save();render()}
let tm=null,left=480;
function adh(){if(tm){clearInterval(tm);tm=null;render();return}tm=setInterval(()=>{left--;if(left<=0){clearInterval(tm);tm=null;left=480;dd("ad").v=1;save();render();return}const e=document.getElementById("clk");if(e)e.textContent=AR(Math.floor(left/60))+":"+AR(String(left%60).padStart(2,"0"))},1000);render()}
function saveRv(){const o={};document.querySelectorAll(".rv").forEach(e=>o[e.dataset.q]=e.value);S.rv[day()]=o;save();alert("تم حفظ المراجعة")}
const RQ=["ما أهم إنجاز حققته؟","ما المهام التي لم تنجزها؟","ما العادة التي تحسنت؟","ما المشكلة التي واجهتك؟","ماذا تعلمت هذا الأسبوع؟","ما المهارة التي تحتاج إلى تطوير؟","ما أهم هدف للأسبوع القادم؟"];

S.ls=S.ls||{};let openL=-1,pickd=-1;
const LS=[
{t:"الأهم قبل العاجل",b:"صنّف مهامك بحسب أهميتها وعجلتها. ابدأ بالمهم حتى لو لم يكن عاجلاً، وإلا ضاع يومك في إطفاء الحرائق.",ex:"صاحب ورشة يقضي أيامه في إصلاح الأعطال، ولا يخصص وقتاً للصيانة الدورية، فتتكرر الأعطال نفسها.",sit:"صباحاً أمامك: عميل غاضب يتصل، وجدولة صيانة دورية، وترتيب المكتب. ماذا تفعل؟",o:["أبدأ بترتيب المكتب كي أرتاح","أرد على العميل، ثم أخصص أول ساعة متاحة للصيانة قبل أي شيء ثانوي","أؤجل الصيانة إلى الأسبوع القادم"],c:1,fb:["الترتيب مهمة غير مهمة الآن.","صحيح: العاجل يُعالج، والمهم غير العاجل يأخذ وقتاً محجوزاً.","التأجيل المتكرر هو سبب تراكم المشاكل."],ex2:"اكتب مهام الغد، وضع بجانب كل مهمة: مهم أو عاجل أو كلاهما.",sum:"احجز كل يوم ساعة ثابتة لمهمة مهمة غير عاجلة."},
{t:"توزيع المهام",b:"المهمة الواضحة لها أربعة أركان: من ينفذ، وما المطلوب بالضبط، ومتى، وكيف أعرف أنها تمت.",ex:"قلت لعامل «رتب المستودع» فرتّب ما رآه مناسباً، ولم تجد ما أردت.",sit:"أي صيغة أفضل لتكليف عامل؟",o:["رتّب المستودع","رتّب الرفوف أ إلى ج حسب النوع قبل ظهر الغد، وأرسل لي صورة","أنا أعلم أنك تعرف ما أريد"],c:1,fb:["غامضة، ولا معيار فيها.","صحيح: مسؤول وتفصيل وموعد ودليل إنجاز.","الافتراض يُنتج سوء فهم."],ex2:"اختر مهمة كلّفت بها أحداً مؤخراً، وأعد كتابتها بالأركان الأربعة.",sum:"لا تكلّف بدون موعد ومعيار إنجاز."},
{t:"العامل المقصّر",b:"ابدأ بالوقائع لا بالاتهام. اسأل عن السبب، ثم اتفقا على خطوة محددة وموعد مراجعة.",ex:"عامل تأخر ثلاث مرات هذا الشهر، وسبب ذلك قد يكون ظرفاً لا تعرفه.",sit:"ما أفضل تصرف؟",o:["أوبّخه أمام الجميع ليتعظ غيره","أكلمه على انفراد: أذكر المرات الثلاث، وأسأله عن السبب، ونتفق على التزام ومراجعة بعد أسبوع","أتجاهل حتى يتراكم الأمر"],c:1,fb:["الإحراج العلني يخسّرك ولاءه.","صحيح: واقعة، وسؤال، واتفاق، ومتابعة.","التجاهل يعلّم الجميع أن التقصير مقبول."],ex2:"سمِّ عاملاً عندك يحتاج حديثاً كهذا، وحدد متى ستكلمه.",sum:"الحزم مع الاحترام، والمتابعة أهم من الغضب."},

 if(openL>=0){const l=LS[openL];return '<div class="sec"><h3>'+esc(l.t)+'</h3><button class="btn s" onclick="closeL()">رجوع</button></div><div class="card"><p><strong>الشرح:</strong> '+esc(l.b)+'</p><p><strong>مثال:</strong> '+esc(l.ex)+'</p><p><strong>الموقف:</strong> '+esc(l.sit)+'</p>'+l.o.map((o,j)=>'<button class="task" onclick="pickA('+j+')">'+esc(o)+'</button>').join("")+(pickd>=0?'<p><strong>'+(pickd===l.c?"إجابة صحيحة. ":"حاول مجدداً. ")+'</strong>'+esc(l.fb[pickd])+'</p>':'')+(pickd===l.c?'<p><strong>التمرين:</strong> '+esc(l.ex2)+'</p><p><strong>الخلاصة:</strong> '+esc(l.sum)+'</p>':'')+'</div>'}
 return '<div class="sec"><h3>دروس الإدارة العملية</h3><small>'+AR(Object.keys(S.ls).length)+' من '+AR(LS.length)+'</small></div>'+LS.map((l,i)=>'<div class="task'+(S.ls[i]?" done":"")+'" onclick="openLesson('+i+')"><span class="chk"></span><span class="t">'+esc(l.t)+'</span></div>').join("")+'<p class="hint">الدروس من كتابتي كمنهج عملي عام، وليست منقولة من كتاب بعينه.</p>'}

{n:1,t:"إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى، فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ فَهِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ، وَمَنْ كَانَتْ هِجْرَتُهُ لِدُنْيَا يُصِيبُهَا أَوِ امْرَأَةٍ يَنْكِحُهَا فَهِجْرَتُهُ إِلَى مَا هَاجَرَ إِلَيْهِ",r:"عمر بن الخطاب",src:"البخاري (١) ومسلم (١٩٠٧)",g:"صحيح، متفق عليه",ex:"قيمة العمل عند الله بقصد صاحبه.",use:"قبل كل عمل اليوم، استحضر نيتك فيه."},
